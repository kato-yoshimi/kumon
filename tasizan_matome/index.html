<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fb">
<title>数のまとまりトレーニング</title>
<style>
:root{--ink:#202534;--muted:#697386;--line:#e4e8ef;--green:#27865c;--orange:#e5a33a;--blue:#4b82c3;--paper:#fff;--bg:#f7f8fb;--red:#c94b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{width:min(720px,100%);margin:0 auto;padding:22px 16px 36px}
header{text-align:center;margin:8px 0 22px}
h1{font-size:clamp(24px,5vw,32px);margin:0 0 7px}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 5px 20px #25324a0a}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mode{border:1px solid var(--line);border-radius:14px;background:white;padding:14px 12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.mode strong{display:block;font-size:16px;margin-bottom:4px}
.mode span{font-size:12px;color:var(--muted)}
.mode.active{border:2px solid var(--green);background:#f1faf5;padding:13px 11px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;color:var(--muted);font-size:13px}
.progress{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress>div{height:100%;width:0;background:var(--green);transition:width .2s}
.prompt{text-align:center;font-size:clamp(25px,6vw,38px);font-weight:750;letter-spacing:.02em;margin:8px 0 18px;min-height:52px}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:-8px 0 18px}
.visual{min-height:112px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 6px 18px}
.group{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.dot{width:clamp(21px,5vw,30px);height:clamp(21px,5vw,30px);border-radius:50%;display:inline-block;flex:none}
.green{background:var(--green)}.orange{background:var(--orange)}.blue{background:var(--blue)}.pale{background:#dce2ea}
.plus{font-size:22px;font-weight:700;color:var(--muted);padding:0 3px}
.tenframes{display:flex;flex-direction:column;gap:7px;width:min(310px,100%)}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{aspect-ratio:1;border:2px solid #dce2ea;border-radius:8px;display:flex;align-items:center;justify-content:center}
.cell .dot{width:70%;height:auto;aspect-ratio:1}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.answer{min-height:58px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);font-size:23px;font-weight:700;cursor:pointer}
.answer:active{transform:scale(.98)}
.answer:disabled{cursor:default;opacity:.8}
.feedback{margin-top:16px;padding:13px 15px;border-radius:13px;background:#f3f5f8;line-height:1.65;font-size:15px}
.feedback.good{background:#eef8f1;color:#216b49}
.feedback.bad{background:#fff5eb;color:#784b19}
.actions{display:flex;gap:10px;margin-top:16px}
button.primary,button.secondary{border:0;border-radius:13px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:white;flex:1}
.secondary{background:#eef1f5;color:var(--ink)}
.hidden{display:none!important}
.finish{text-align:center;padding:24px 8px}
.finish h2{font-size:27px;margin:0 0 8px}
.finish p{color:var(--muted);line-height:1.7}
.smallnote{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media(max-width:420px){main{padding:16px 12px 28px}.panel{padding:15px}.mode{padding:12px 10px}.answers{gap:7px}.answer{min-height:54px}}
</style>
</head>
<body>
<main>
<header>
  <h1>数のまとまりトレーニング</h1>
  <div class="sub">見て、分けて、10を作ろう</div>
</header>

<section class="modes" aria-label="トレーニングを選ぶ">
  <button class="mode active" data-mode="1"><strong>① 数の分解</strong><span>0～5の組み合わせ</span></button>
  <button class="mode" data-mode="2"><strong>② 5の塊</strong><span>5と残りに分ける</span></button>
  <button class="mode" data-mode="3"><strong>③ 10を作る</strong><span>10のまとまりを作る</span></button>
  <button class="mode" data-mode="4"><strong>④ 足し算</strong><span>繰り上がりのある計算</span></button>
</section>

<section class="panel" id="game">
  <div class="topline"><span id="modeName">① 数の分解</span><span id="count">1 / 5 問</span></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="prompt" id="prompt">4 は 1 と □</div>
  <div class="hint" id="hint">□に入る数を選ぼう</div>
  <div class="visual" id="visual"></div>
  <div class="answers" id="answers"></div>
  <div class="feedback hidden" id="feedback" aria-live="polite"></div>
  <div class="actions">
    <button class="secondary" id="speak">🔊 もう一度読む</button>
    <button class="primary hidden" id="next">次の問題</button>
  </div>
</section>

<section class="panel finish hidden" id="finish">
  <h2>5問おわり！</h2>
  <p id="finishText">よく取り組んだね。</p>
  <button class="primary" id="again">もう一度あそぶ</button>
</section>
<div class="smallnote">急がなくて大丈夫。数のまとまりを見つけよう。</div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const modeNames = {1:"① 数の分解",2:"② 5の塊",3:"③ 10を作る",4:"④ 足し算"};
  const hardSums = [[7,5],[8,5],[6,7],[8,6],[9,5],[7,6],[9,4],[8,7],[9,6],[8,8],[9,7],[9,8],[9,9]];
  let mode=1, qIndex=0, current=null, locked=false, correctCount=0, used=[];
  const shuffle = arr => [...arr].sort(()=>Math.random()-.5);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const speak = text => {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.88;
    window.speechSynthesis.speak(u);
  };
  function dots(n, color="green") {
    return `<div class="group">${Array.from({length:n},()=>`<i class="dot ${color}"></i>`).join("")}</div>`;
  }
  function groupedDots(a,b,ca="green",cb="orange") {
    return `<div class="group">${dots(a,ca)}<span class="plus">＋</span>${dots(b,cb)}</div>`;
  }
  function tenFrame(first, fillToTen, remainder) {
    let cells=[];
    for(let i=0;i<20;i++){
      let color="";
      if(i<first) color="green";
      else if(i<first+fillToTen) color="orange";
      else if(i<10+remainder) color="blue";
      cells.push(`<div class="cell">${color?`<i class="dot ${color}"></i>`:""}</div>`);
    }
    return `<div class="tenframes"><div class="frame">${cells.slice(0,10).join("")}</div><div class="frame">${cells.slice(10).join("")}</div></div>`;
  }
  function choices(answer,min=0,max=18) {
    const set=new Set([answer]);
    while(set.size<4){
      let n=answer+pick([-3,-2,-1,1,2,3]);
      if(n>=min&&n<=max)set.add(n);
    }
    return shuffle([...set]);
  }
  function makeQuestion() {
    if(mode===1){
      const total=pick([2,3,4,5]);
      const part=1+Math.floor(Math.random()*(total-1));
      return {a:total,b:part,answer:total-part,question:`${total} は ${part} と □`,speech:`${total}は${part}と、いくつ？`,hint:"□に入る数を選ぼう",
        visual:groupedDots(part,total-part),explain:`${total}は${part}と${total-part}。合わせると${total}になるよ。`};
    }
    if(mode===2){
      const total=pick([6,7,8,9]), rest=total-5;
      return {a:total,b:5,answer:rest,question:`${total} は 5 と □`,speech:`${total}は5と、いくつ？`,hint:"5の塊のほかに、いくつある？",
        visual:groupedDots(5,rest),explain:`${total}は、5と${rest}。緑の5個と、オレンジの${rest}個だよ。`};
    }
    if(mode===3){
      const a=pick([6,7,8,9]), b=pick([11-a,12-a,13-a,14-a,15-a].filter(x=>x>0&&x<=9));
      const fill=10-a, remainder=b-fill, answer=a+b;
      return {a,b,answer,question:`${a} ＋ ${b} ＝ □`,speech:`${a}たす${b}は、いくつ？10を作って考えよう。`,hint:`${a}にあと${fill}で10。${b}を分けてみよう。`,
        visual:tenFrame(a,fill,remainder),explain:`${a}に${fill}を足すと10。${b}は${fill}と${remainder}に分けられるから、10と${remainder}で${answer}だよ。`};
    }
    let pair=pick(hardSums);
    return {a:pair[0],b:pair[1],answer:pair[0]+pair[1],question:`${pair[0]} ＋ ${pair[1]} ＝ □`,speech:`${pair[0]}たす${pair[1]}は、いくつ？`,hint:"ドットのまとまりを見て考えよう。",
      visual:tenFrame(pair[0],Math.min(pair[1],10-pair[0]),Math.max(0,pair[0]+pair[1]-10)),
      explain:`${pair[0]}は10まであと${10-pair[0]}。${pair[1]}から${10-pair[0]}を使うと10になり、${pair[1]-(10-pair[0])}が残るよ。答えは${pair[0]+pair[1]}。`};
  }
  function render() {
    $("modeName").textContent=modeNames[mode];
    $("count").textContent=`${qIndex+1} / 5 問`;
    $("bar").style.width=`${qIndex/5*100}%`;
    $("prompt").textContent=current.question;
    $("hint").textContent=current.hint;
    $("visual").innerHTML=current.visual;
    $("feedback").className="feedback hidden";
    $("next").classList.add("hidden");
    $("answers").innerHTML="";
    locked=false;
    choices(current.answer,0, mode===1?5:mode===2?4:18).forEach(n=>{
      const btn=document.createElement("button");
      btn.className="answer";btn.textContent=n;
      btn.addEventListener("click",()=>check(n,btn));
      $("answers").appendChild(btn);
    });
    speak(current.speech);
  }
  function check(n,btn) {
    if(locked)return;
    if(n===current.answer){
      locked=true;correctCount++;
      $("feedback").className="feedback good";
      $("feedback").innerHTML=`<strong>正解！</strong><br>${current.explain}`;
      [...$("answers").children].forEach(b=>b.disabled=true);
      $("next").classList.remove("hidden");
      $("next").textContent=qIndex===4?"結果を見る":"次の問題";
    } else {
      $("feedback").className="feedback bad";
      $("feedback").innerHTML=`<strong>おしい！</strong><br>${current.explain}<br>ドットのまとまりを見ながら、もう一度選んでみよう。`;
      btn.disabled=true;
    }
  }
  function start(nextMode=mode) {
    mode=nextMode;qIndex=0;correctCount=0;
    $("game").classList.remove("hidden");$("finish").classList.add("hidden");
    document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",Number(b.dataset.mode)===mode));
    current=makeQuestion();render();
  }
  function next() {
    if(qIndex===4){
      $("game").classList.add("hidden");$("finish").classList.remove("hidden");
      $("finishText").textContent=`5問中${correctCount}問正解できたよ。最後までよく考えたね。`;
      return;
    }
    qIndex++;current=makeQuestion();render();
  }
  document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>start(Number(b.dataset.mode))));
  $("next").addEventListener("click",next);
  $("speak").addEventListener("click",()=>speak(current.speech));
  $("again").addEventListener("click",()=>start(mode));
  start(1);
})();
</script>
</body>
</html>
